name: CI

on:
  push:                     # any branch push
    branches: ["**"]
  pull_request:             # PRs into main
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (tests + style)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      # ---- Unit tests ----
      - name: Run unit tests
        run: |
          pytest -q -m "not functional" -k "not functional"

      # ---- Functional tests ----
      - name: Run functional tests (marker)
        run: pytest -q -m functional

      - name: Run functional tests (name contains 'functional')
        run: pytest -q -k functional

      # ---- Style checks ----
      - name: Style checks
        run: flake8 .
